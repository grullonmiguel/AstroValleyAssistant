<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>html, body, #map { height: 100%; margin: 0; }</style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Whole contiguous US; zoomControl off so it doesn't sit under the WPF header.
        // Finer zoom steps: 0.25 per snap, wheel needs 240px per zoom level (default 60 = jumpy).
        var map = L.map('map', {
            zoomControl: false,
            zoomSnap: 0.25,
            zoomDelta: 0.5,
            wheelPxPerZoomLevel: 240
        });
        // Fit the contiguous US into the free area: left padding clears the sidebar, top clears the header.
        map.fitBounds([[24.5, -125], [49.5, -66.5]], {
            paddingTopLeft: [280, 100],
            paddingBottomRight: [40, 40]
        });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
    </script>
</body>
</html>
