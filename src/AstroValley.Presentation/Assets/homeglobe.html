<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/';</script>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #globe { height: 100%; margin: 0; background: #000; overflow: hidden; }
        .cesium-viewer-toolbar { display: none; } /* WPF owns the controls */
    </style>
</head>
<body>
    <div id="globe"></div>
    <script>
        // Same page contract as homemap.html (Leaflet): WPF calls highlightState / highlightCounty / setImagery
        // and receives {type:'counties'} messages, so HomeView doesn't care which page is loaded.
        // No Cesium ion token: Esri imagery + flat terrain. shortcut: set Cesium.Ion.defaultAccessToken for ion imagery/terrain.
        var esri = function (path) {
            return new Cesium.UrlTemplateImageryProvider({
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/' + path + '/MapServer/tile/{z}/{y}/{x}',
                maximumLevel: 19, credit: 'Tiles © Esri'
            });
        };
        var streetLayer = new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' }));
        var satLayer = new Cesium.ImageryLayer(esri('World_Imagery'), { show: false });
        var labelLayer = new Cesium.ImageryLayer(esri('Reference/World_Boundaries_and_Places'), { show: false });

        var viewer = new Cesium.Viewer('globe', {
            baseLayer: streetLayer,
            baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
            navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false,
            infoBox: false, selectionIndicator: false, scene3DOnly: true,
            // Render at the screen's real pixel density (default draws at CSS pixels and stretches, which makes thin lines rough).
            useBrowserRecommendedResolution: false
        });
        viewer.scene.postProcessStages.fxaa.enabled = true; // smooths line edges
        viewer.imageryLayers.add(satLayer);
        viewer.imageryLayers.add(labelLayer);
        viewer.scene.screenSpaceCameraController.minimumZoomDistance = 300; // don't dive into the ground

        var outlineDS = new Cesium.CustomDataSource('outline');
        var countyDS = new Cesium.CustomDataSource('counties');
        var highlightDS = new Cesium.CustomDataSource('highlight');
        [countyDS, outlineDS, highlightDS].forEach(function (ds) { viewer.dataSources.add(ds); });

        // ---- camera -------------------------------------------------------------------------------------------
        // Fly so the area sits right of centre and below the top: clears the WPF sidebar (left) and header (top).
        function rectFor(w, s, e, n) {
            var dw = e - w, dh = n - s;
            return Cesium.Rectangle.fromDegrees(w - dw * 0.45, s - dh * 0.05, e + dw * 0.05, n + dh * 0.10);
        }
        var US = rectFor(-125, 24.5, -66.5, 49.5);
        viewer.camera.setView({ destination: US });
        function flyTo(rect) { viewer.camera.flyTo({ destination: rect, duration: 1.5 }); }

        // [west, south, east, north] of a geometry. skipEast drops positive longitudes (Alaska's Aleutians wrap past 180).
        function boundsOf(geom, skipEast) {
            var w = 180, e = -180, s = 90, n = -90;
            (function walk(c) {
                if (typeof c[0] === 'number') {
                    if (skipEast && c[0] > 0) return;
                    w = Math.min(w, c[0]); e = Math.max(e, c[0]); s = Math.min(s, c[1]); n = Math.max(n, c[1]);
                } else c.forEach(walk);
            })(geom.coordinates);
            return [w, s, e, n];
        }

        // ---- colours ------------------------------------------------------------------------------------------
        // Purple on the street map, white on satellite (purple vanishes on dark photos).
        var imagery = false;
        function lineColor() { return imagery ? Cesium.Color.WHITE : Cesium.Color.fromCssColorString('#4F4486'); }

        // Highlight fill fades out as the camera comes down (full above 400 km, gone below 100 km) so streets show.
        function highlightFill() {
            var h = viewer.camera.positionCartographic.height;
            return 0.35 * Math.min(1, Math.max(0, (h - 100000) / 300000));
        }

        function restyle() {
            outlineDS.entities.values.forEach(function (e) { e.polyline.material = lineColor(); });
            countyDS.entities.values.forEach(function (e) { e.polyline.material = lineColor().withAlpha(0.7); });
            highlightDS.entities.values.forEach(function (e) {
                if (e.polyline) e.polyline.material = lineColor();
                if (e.polygon) e.polygon.material = lineColor().withAlpha(highlightFill());
            });
        }
        viewer.camera.percentageChanged = 0.05;
        viewer.camera.changed.addEventListener(function () {
            if (highlightDS.entities.values.length) restyle();
        });

        function setImagery(on) {
            imagery = on;
            streetLayer.show = !on;
            satLayer.show = on;
            labelLayer.show = on;
            restyle();
        }

        // ---- geometry helpers ---------------------------------------------------------------------------------
        function linesOf(g) {
            switch (g.type) {
                case 'Polygon': return g.coordinates;
                case 'MultiPolygon': return g.coordinates.flat(1);
                case 'MultiLineString': return g.coordinates;
                default: return [g.coordinates]; // LineString
            }
        }
        function addLines(ds, geometry, width, color) {
            linesOf(geometry).forEach(function (ring) {
                ds.entities.add({ polyline: {
                    positions: Cesium.Cartesian3.fromDegreesArray(ring.flat()),
                    width: width, clampToGround: true, material: color
                } });
            });
        }

        // ---- selected state outline + counties -----------------------------------------------------------------
        var statesData = null, selectedName = null, countyFeatures = [], loadToken = 0;
        fetch('Geo/us-states.geojson').then(function (r) { return r.json(); }).then(function (d) { statesData = d; drawOutline(); });

        function highlightState(name) { selectedName = name; drawOutline(); }

        function clearCounties() {
            loadToken++; // makes any in-flight county load stale
            countyDS.entities.removeAll();
            highlightDS.entities.removeAll();
            countyFeatures = [];
        }

        // "Bay" for counties; "Acadia Parish", "Richmond city" etc. otherwise (keeps same-named entries apart).
        function countyLabel(p) { return p.LSAD === 'County' ? p.NAME : p.NAME + ' ' + p.LSAD; }

        function drawOutline() {
            var hadOutline = outlineDS.entities.values.length > 0;
            outlineDS.entities.removeAll();
            clearCounties();
            if (!selectedName) { // selection cleared: fly back out to the whole US
                if (hadOutline) flyTo(US);
                return;
            }
            if (!statesData) return; // called again once the data arrives
            var f = statesData.features.find(function (f) { return f.properties.name === selectedName; });
            if (!f) return;
            addLines(outlineDS, f.geometry, 3, lineColor());
            var b = boundsOf(f.geometry, selectedName === 'Alaska');
            flyTo(rectFor(b[0], b[1], b[2], b[3]));
            loadCounties(f.id, selectedName); // state FIPS = feature id, same as the county file name
        }

        function loadCounties(fips, stateName) {
            var token = ++loadToken;
            fetch('Geo/counties/' + fips + '.geojson').then(function (r) { return r.json(); }).then(function (d) {
                if (token !== loadToken) return; // another state was selected meanwhile
                countyFeatures = d.features;
                d.features.forEach(function (f) { addLines(countyDS, f.geometry, 1, lineColor().withAlpha(0.7)); });
                // Tell WPF the county names for its list.
                var msg = {
                    type: 'counties', state: stateName,
                    items: d.features
                        .map(function (f) { return { id: f.properties.COUNTY, name: countyLabel(f.properties) }; })
                        .sort(function (a, b) { return a.name.localeCompare(b.name); })
                };
                if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(msg);
            });
        }

        function highlightCounty(id) {
            highlightDS.entities.removeAll();
            var f = id && countyFeatures.find(function (f) { return f.properties.COUNTY === id; });
            if (!f) return;
            addLines(highlightDS, f.geometry, 3, lineColor());
            var polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
            polys.forEach(function (rings) {
                var pos = rings.map(function (r) { return Cesium.Cartesian3.fromDegreesArray(r.flat()); });
                highlightDS.entities.add({ polygon: {
                    hierarchy: new Cesium.PolygonHierarchy(pos[0], pos.slice(1).map(function (h) { return new Cesium.PolygonHierarchy(h); })),
                    material: lineColor().withAlpha(highlightFill())
                } });
            });
        }
    </script>
</body>
</html>
