<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <link href="pinpopup.css" rel="stylesheet" />
    <style>html, body, #map { height: 100%; margin: 0; background: #000; }</style>
    <script src="pinpopup.js"></script>
</head>
<body>
    <div id="map"></div>
    <script>
        // Same page contract as homemap.html (Leaflet) and homeglobe.html (Cesium): WPF calls highlightState /
        // highlightCounty / setImagery and receives {type:'counties'} messages, so HomeView doesn't care which page loads.
        var esri = function (path) {
            return 'https://server.arcgisonline.com/ArcGIS/rest/services/' + path + '/MapServer/tile/{z}/{y}/{x}';
        };
        var PURPLE = '#4F4486', WHITE = '#FFFFFF';
        var imagery = false;
        function lineColor() { return imagery ? WHITE : PURPLE; }
        function emptyFc() { return { type: 'FeatureCollection', features: [] }; }

        var map = new maplibregl.Map({
            container: 'map',
            center: [-98, 38], zoom: 3,
            attributionControl: { compact: true },
            style: {
                version: 8,
                projection: { type: 'globe' },
                sources: {
                    street: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19, attribution: '&copy; OpenStreetMap contributors' },
                    imagery: { type: 'raster', tiles: [esri('World_Imagery')], tileSize: 256, maxzoom: 19, attribution: 'Tiles &copy; Esri' },
                    labels: { type: 'raster', tiles: [esri('Reference/World_Boundaries_and_Places')], tileSize: 256, maxzoom: 19 },
                    outline: { type: 'geojson', data: emptyFc() },
                    counties: { type: 'geojson', data: emptyFc() },
                    highlight: { type: 'geojson', data: emptyFc() },
                    parcels: { type: 'geojson', data: emptyFc() },
                    dem: DEM_SOURCE,
                    flood: overlaySource('flood'),
                    wetlands: overlaySource('wetlands'),
                    epa: epaSource()
                },
                layers: [
                    { id: 'bg', type: 'background', paint: { 'background-color': '#000' } },
                    { id: 'street', type: 'raster', source: 'street' },
                    { id: 'imagery', type: 'raster', source: 'imagery', layout: { visibility: 'none' } },
                    overlayLayer('flood'), overlayLayer('wetlands'), // toggled from WPF; under our lines
                    // our lines sit under the labels so place names stay readable
                    { id: 'county-lines', type: 'line', source: 'counties', paint: { 'line-color': PURPLE, 'line-width': 1, 'line-opacity': 0.7 } },
                    { id: 'highlight-fill', type: 'fill', source: 'highlight', paint: {
                        'fill-color': PURPLE,
                        // fades out between zoom 8 and 10 so streets show when zoomed in
                        'fill-opacity': ['interpolate', ['linear'], ['zoom'], 8, 0.35, 10, 0]
                    } },
                    { id: 'highlight-line', type: 'line', source: 'highlight', paint: { 'line-color': PURPLE, 'line-width': 3 } },
                    { id: 'outline-line', type: 'line', source: 'outline', paint: { 'line-color': PURPLE, 'line-width': 3 } },
                    // parcel boundaries for pins sent from Real Auction / Regrid (neon green reads on both base maps)
                    { id: 'parcel-fill', type: 'fill', source: 'parcels', paint: { 'fill-color': '#39ff14', 'fill-opacity': 0.2 } },
                    { id: 'parcel-line', type: 'line', source: 'parcels', paint: { 'line-color': '#39ff14', 'line-width': 3 } },
                    epaLayer(),
                    { id: 'labels', type: 'raster', source: 'labels', layout: { visibility: 'none' } }
                ]
            }
        });

        // Padding clears the WPF overlays: sidebar (+ county list once a state is selected) on the left, header on top.
        // The state sidebar is 195px wide open, 36px collapsed (WPF reports it via setSidebarOpen).
        var sidebarOpen = true;
        function setSidebarOpen(open) { sidebarOpen = open; }
        function sideShift() { return sidebarOpen ? 0 : 159; }
        function pad(withCounties) {
            return withCounties ? { left: 430 - sideShift(), top: 110, right: 60, bottom: 40 } : { left: 260 - sideShift(), top: 100, right: 40, bottom: 40 };
        }
        // Slightly tighter than the full contiguous US (-125..-66.5, 24.5..49.5) so the start view is closer in.
        var US_BOUNDS = [[-120, 26], [-72, 47.5]];
        function flyTo(bounds, withCounties) {
            map.fitBounds(bounds, { padding: pad(withCounties), duration: 1500, essential: true });
        }
        // style.load (not load): 'load' waits for every first tile and could fire after a state was already selected.
        map.once('style.load', function () { map.fitBounds(US_BOUNDS, { padding: pad(false), duration: 0 }); });
        // First tiles are on screen: tell WPF to drop its loading cover.
        map.once('load', function () { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({ type: 'ready' }); });

        // [[west, south], [east, north]] of a geometry. skipEast drops positive longitudes (Alaska's Aleutians wrap past 180).
        function boundsOf(geom, skipEast) {
            var w = 180, e = -180, s = 90, n = -90;
            (function walk(c) {
                if (typeof c[0] === 'number') {
                    if (skipEast && c[0] > 0) return;
                    w = Math.min(w, c[0]); e = Math.max(e, c[0]); s = Math.min(s, c[1]); n = Math.max(n, c[1]);
                } else c.forEach(walk);
            })(geom.coordinates);
            return [[w, s], [e, n]];
        }

        function setImagery(on) { whenReady(function () { applyImagery(on); }); }

        function applyImagery(on) {
            imagery = on;
            var vis = function (id, show) { map.setLayoutProperty(id, 'visibility', show ? 'visible' : 'none'); };
            vis('street', !on); vis('imagery', on); vis('labels', on);
            var c = lineColor(); // purple on the street map, white on satellite
            ['county-lines', 'highlight-line', 'outline-line'].forEach(function (id) { map.setPaintProperty(id, 'line-color', c); });
            map.setPaintProperty('highlight-fill', 'fill-color', c);
        }

        // ---- selected state outline + counties -----------------------------------------------------------------
        var statesData = null, selectedName = null, countyFeatures = [], loadToken = 0, hadOutline = false;
        fetch('Geo/us-states.geojson').then(function (r) { return r.json(); }).then(function (d) { statesData = d; whenReady(drawOutline); });

        // The style may not be loaded yet when WPF or fetch call in.
        function whenReady(fn) { if (map.isStyleLoaded()) fn(); else map.once('style.load', fn); }

        function highlightState(name) { selectedName = name; whenReady(drawOutline); }

        function clearCounties() {
            loadToken++; // makes any in-flight county load stale
            map.getSource('counties').setData(emptyFc());
            map.getSource('highlight').setData(emptyFc());
            countyFeatures = [];
        }

        // "Bay" for counties; "Acadia Parish", "Richmond city" etc. otherwise (keeps same-named entries apart).
        function countyLabel(p) { return p.LSAD === 'County' ? p.NAME : p.NAME + ' ' + p.LSAD; }

        function drawOutline() {
            clearCounties();
            map.getSource('outline').setData(emptyFc());
            if (!selectedName) { // selection cleared: fly back out to the whole US
                if (hadOutline) flyTo(US_BOUNDS, false);
                hadOutline = false;
                return;
            }
            if (!statesData) return; // called again once the data arrives
            var f = statesData.features.find(function (f) { return f.properties.name === selectedName; });
            if (!f) return;
            map.getSource('outline').setData({ type: 'FeatureCollection', features: [f] });
            hadOutline = true;
            flyTo(boundsOf(f.geometry, selectedName === 'Alaska'), true);
            loadCounties(f.id, selectedName); // state FIPS = feature id, same as the county file name
        }

        function loadCounties(fips, stateName) {
            var token = ++loadToken;
            fetch('Geo/counties/' + fips + '.geojson').then(function (r) { return r.json(); }).then(function (d) {
                if (token !== loadToken) return; // another state was selected meanwhile
                countyFeatures = d.features;
                map.getSource('counties').setData(d);
                // Tell WPF the county names for its list.
                var msg = {
                    type: 'counties', state: stateName,
                    items: d.features
                        .map(function (f) { return { id: f.properties.COUNTY, name: countyLabel(f.properties) }; })
                        .sort(function (a, b) { return a.name.localeCompare(b.name); })
                };
                if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(msg);
            });
        }

        // ---- pins sent from WPF (Real Auction / Regrid "Map" button) -------------------------------------------
        var parcelFeatures = [], pinMarkers = [];
        // esc() and popupHtml() live in pinpopup.js (shared with the exported map).

        // WPF only sends pins that are not on the map yet, so this just appends.
        function addMarkers(list) {
            // getSource works as soon as the style exists (isStyleLoaded can stay false while tiles load)
            (map.getSource('parcels') ? function (fn) { fn(); } : function (fn) { map.once('style.load', fn); })(function () {
                var bounds = new maplibregl.LngLatBounds();
                list.forEach(function (loc) {
                    var marker = makePin(loc, map); // colour by auction urgency (pinpopup.js)
                    pinMarkers.push({ marker: marker, lat: loc.Latitude, lon: loc.Longitude });
                    bounds.extend([loc.Longitude, loc.Latitude]);

                    if (!loc.ParcelLines) return;
                    try { // Regrid GeoJSON: a geometry, a Feature or a FeatureCollection
                        var g = JSON.parse(loc.ParcelLines);
                        var feats = g.type === 'FeatureCollection' ? g.features : [g.type === 'Feature' ? g : { type: 'Feature', geometry: g }];
                        // tag each outline with its pin so removeMarker can drop it again
                        feats.forEach(function (f) {
                            f.properties = Object.assign({}, f.properties, { pin: pinKey(loc.Latitude, loc.Longitude) });
                            parcelFeatures.push(f);
                        });
                    } catch (e) { console.error('Bad ParcelLines for ' + loc.ParcelID, e); }
                });
                drawParcels();
                if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: pinPad(), maxZoom: 17, duration: 1500 });
            });
        }

        function pinKey(lat, lon) { return lat + ',' + lon; }
        function drawParcels() {
            var shown = parcelFeatures.filter(function (f) { return !hiddenKeys[f.properties.pin]; });
            var src = map.getSource('parcels');
            if (src) src.setData({ type: 'FeatureCollection', features: shown }); // not there yet: addMarkers draws once the style loads
        }

        function removeMarker(lat, lon) {
            var key = pinKey(lat, lon);
            pinMarkers = pinMarkers.filter(function (p) {
                if (pinKey(p.lat, p.lon) !== key) return true;
                p.marker.remove(); // also closes its popup
                return false;
            });
            parcelFeatures = parcelFeatures.filter(function (f) { return f.properties.pin !== key; });
            drawParcels();
        }

        function clearMarkers() {
            pinMarkers.forEach(function (p) { p.marker.remove(); });
            pinMarkers = [];
            parcelFeatures = [];
            drawParcels();
        }

        // ---- filter chips, 3D terrain and tour (driven from WPF) -------------------------------------------------------
        var hiddenKeys = {}, terrain3d = false, overlayOn = { flood: false, wetlands: false, epa: false };
        // Called by the popup editor (pinpopup.js): status / notes changed, tell WPF so they are saved with the pins.
        function onPinEdit(loc) {
            if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({
                type: 'pinEdit', lat: loc.Latitude, lon: loc.Longitude, status: loc.Status || null, notes: loc.Notes || null,
                accessStatus: loc.AccessStatus || null, accessFt: loc.AccessDistanceFt == null ? null : loc.AccessDistanceFt,
                accessRoad: loc.AccessRoad || null, accessChecked: loc.AccessChecked || null });
        }
        function postMode() {
            if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage({
                type: 'mode', terrain: terrain3d, touring: TOUR.on, flood: overlayOn.flood, wetlands: overlayOn.wetlands, epa: overlayOn.epa });
        }
        function toggleOverlay(key) { overlayOn[key] = !overlayOn[key]; setOverlay(map, key, overlayOn[key]); postMode(); }
        wireIdentify(map, function () { return overlayOn; });
        wireEpa(map, function () { return overlayOn.epa; });
        // keys of the pins the active filter hides ("lat,lon")
        function setHidden(keys) {
            hiddenKeys = {};
            keys.forEach(function (k) { hiddenKeys[k] = 1; });
            pinMarkers.forEach(function (p) {
                var hide = !!hiddenKeys[pinKey(p.lat, p.lon)];
                p.marker.getElement().style.display = hide ? 'none' : '';
                if (hide && p.marker.getPopup().isOpen()) p.marker.togglePopup();
            });
            drawParcels();
        }
        function apply3d(on) { terrain3d = on; set3d(map, on, true); postMode(); }
        function toggle3d() { apply3d(!terrain3d); }
        function toggleTour() {
            if (TOUR.on) { stopTour(); return; }
            var shown = pinMarkers.filter(function (p) { return !hiddenKeys[pinKey(p.lat, p.lon)]; });
            startTour(map, shown, { pad: pinPad, is3d: function () { return terrain3d; }, set3d: apply3d, onState: postMode });
        }

        // The parcel list adds a third panel on the left (county list too once a state is selected).
        function pinPad() { return { left: (countyFeatures.length ? 650 : 490) - sideShift(), top: 110, right: 60, bottom: 40 }; }

        // Flies to a pin and opens its popup once the camera arrives (other popups are closed first).
        function flyToMarker(lat, lon) {
            var hit = pinMarkers.find(function (p) { return Math.abs(p.lat - lat) < 1e-9 && Math.abs(p.lon - lon) < 1e-9; });
            pinMarkers.forEach(function (p) { if (p.marker.getPopup().isOpen()) p.marker.togglePopup(); });
            map.once('moveend', function () { if (hit && !hit.marker.getPopup().isOpen()) hit.marker.togglePopup(); });
            map.flyTo({ center: [lon, lat], zoom: 17, padding: pinPad(), essential: true });
        }

        function highlightCounty(id) {
            whenReady(function () {
                var f = id && countyFeatures.find(function (f) { return f.properties.COUNTY === id; });
                map.getSource('highlight').setData(f ? { type: 'FeatureCollection', features: [f] } : emptyFc());
            });
        }
    </script>
</body>
</html>
